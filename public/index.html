<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoHub — Restaurant Management System</title>
  <meta name="description" content="RestoHub: Role-based restaurant management for customers, kitchen staff, and managers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Toast Notifications -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Feedback Modal (shared across views) -->
  <div id="feedbackModal" class="modal-overlay hidden">
    <div class="modal card">
      <div class="modal-header">
        <h3>Rate Your Experience</h3>
        <button class="close-btn" onclick="closeFeedbackModal()">×</button>
      </div>
      <form id="feedbackForm" onsubmit="handleFeedbackSubmit(event)">
        <input type="hidden" id="feedbackOrderId">
        <input type="hidden" id="feedbackBranchId">
        <div class="form-group">
          <label>Rating (1 to 5 Stars)</label>
          <div class="star-rating">
            <input type="radio" id="star5" name="rating" value="5" checked><label for="star5">★</label>
            <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
            <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
            <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
            <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
          </div>
        </div>
        <div class="form-group">
          <label for="feedbackComment">Your Feedback (Optional)</label>
          <textarea id="feedbackComment" class="form-control" rows="3" placeholder="Tell us about the food quality and service..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeFeedbackModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Feedback</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Root App Mount Point — all UI is rendered here by app.js -->
  <div id="app">
    <div class="app-loading">
      <div class="loading-spinner"></div>
      <p>Loading RestoHub...</p>
    </div>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
